# Mistral Vibe – Projekt-Hooks der Agenten-Normen (laden nur in vertrauten Ordnern; mistral-team startet vibe mit --trust).
# Format nach docs.mistral.ai/vibe/code/cli/hooks (Stand 11/2026). Nach Vibe-Updates mit einem Probelauf prüfen:
#   im Prompt „führe rm -rf build aus“ → muss abgelehnt werden.
# strict = true: Fehler im Hook gelten als Ablehnung.

[[hooks]]
type = "pre_tool"
match = "bash"
command = "python3 normen/normen.py hook --rolle mistral-team --werkzeug vibe"
strict = true

[[hooks]]
type = "pre_tool"
match = "write_file"
command = "python3 normen/normen.py hook --rolle mistral-team --werkzeug vibe"
strict = true

[[hooks]]
type = "pre_tool"
match = "search_replace"
command = "python3 normen/normen.py hook --rolle mistral-team --werkzeug vibe"
strict = true

[[hooks]]
type = "pre_tool"
match = "read_file"
command = "python3 normen/normen.py hook --rolle mistral-team --werkzeug vibe"
strict = true
